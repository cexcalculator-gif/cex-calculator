<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькулятор цеха — модель R</title><style>body{font:16px system-ui;background:#f5f6f8;color:#17212b;margin:0}main{max-width:850px;margin:auto;padding:16px}h1{font-size:25px}.panel{background:white;padding:18px;border-radius:12px;margin:14px 0;box-shadow:0 1px 5px #ddd}label{display:block;margin:12px 0 5px;font-weight:600}input,select,button{font:inherit;padding:11px;border:1px solid #c8ced5;border-radius:8px;box-sizing:border-box}input,select{width:100%}button{background:#1465d9;color:white;border:0;margin:8px 6px 8px 0;cursor:pointer}.remove{background:#a63131}.window{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.muted{color:#606a76;font-size:14px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #cbd1d8;padding:7px;text-align:left}th{background:#eef3fa}.warning{background:#fff3cf;padding:12px;border-radius:8px}.sheet{background:white;padding:16px;margin:12px 0}.diagram{border:3px solid #222;position:relative;margin:24px auto 36px;width:70%;height:125px}.diagram .width{position:absolute;bottom:-26px;left:0;right:0;text-align:center}.diagram .height{position:absolute;right:-65px;top:45px}.diagram .proj{position:absolute;left:-65px;top:45px}.pagebreak{break-before:page}.only-print{display:none}@media print{body{background:white}main{max-width:none;padding:0}.panel,.sheet{box-shadow:none;border:0} .no-print{display:none!important}.only-print{display:block}.sheet{padding:0} @page{size:A4 portrait;margin:12mm}h1{font-size:20px}table{font-size:11px}th,td{padding:4px}.diagram{height:85px;margin:14px auto 27px}} .drawing-item{display:inline-block;vertical-align:top;width:30.5%;margin:1%;break-inside:avoid;font-size:12px}.drawing{width:100%;max-height:125px}.small{font-size:11px;color:#555}.welder{break-after:page}@media print{@page{size:A4 portrait;margin:8mm}.drawing-item{width:30.5%;margin:1%;font-size:10px}.drawing{max-height:95px}.sheet{break-inside:auto}.pagebreak{break-before:page}}.balsteps{font-size:16px;font-weight:700;margin:3px 0 5px}@media print{.balsteps{font-size:15px}}

.cutsubhead{font-size:17px;font-weight:800;margin:14px 0 6px;border-top:2px solid #333;padding-top:10px}</style></head><body><main><div class="no-print"><h1>Калькулятор цеха — модель R</h1><p class="muted">Тестовая версия модели R. Квадратура считается автоматически по размерам замерщика. Раскрой балконов предварительный: угловые соединения и независимые выносы требуют проверки технологом.</p><section class="panel"><label>Номер заказа</label><input id="order" placeholder="Например, 2805"><label>Квадратура заказа, м² (автоматически)</label><input id="area" type="text" readonly placeholder="Рассчитается после ввода размеров"><label>Модель заказа</label><input id="model" value="R-1"></section><section class="panel"><h2>Размеры от замерщика</h2><div id="windows"></div><button type="button" id="add">+ Добавить окно</button><button type="button" id="addBalcony">+ Добавить балкон</button><div id="balconies"></div></section><button type="button" id="calculate">Рассчитать</button><button type="button" id="print">Печать / PDF</button><button type="button" id="reset" class="remove">Новый заказ / Очистить всё</button><p id="error" class="warning" hidden></p></div><div id="result"></div></main><script>
'use strict';const $=id=>document.getElementById(id);const projectionData={200:{add:190,side:4},300:{add:390,side:4},400:{add:590,side:6},500:{add:790,side:8},600:{add:990,side:10}};let seq=0,balconySeq=0;
function addWindow(){if(document.querySelectorAll('.window').length>=8){alert('Можно добавить не более 8 окон.');return;}seq++;const div=document.createElement('div');div.className='window';div.innerHTML=`<strong>Окно ${seq}</strong><div class="grid"><div><label>Ширина, мм</label><input class="w" type="number" min="1" step="1" placeholder="2900"></div><div><label>Высота, мм</label><input class="h" type="number" min="1" step="1" placeholder="1580"></div><div><label>Вынос, мм</label><select class="p">${`<option value="0">0 — прямое окно</option>`+Object.keys(projectionData).map(x=>`<option value="${x}" ${x==='400'?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Установка</label><select class="mount"><option value="outside">Снаружи откоса</option><option value="inside">Внутри откоса</option></select></div><div><label>Крыша</label><select class="roof"><option value="none">Без крыши</option><option value="profiled">С крышей — профнастил</option></select></div></div><button class="remove" type="button">Удалить окно</button>`;div.querySelector('.remove').onclick=()=>div.remove();const syncStraight=()=>{const isStraight=div.querySelector('.p').value==='0';const mount=div.querySelector('.mount'),roof=div.querySelector('.roof');if(isStraight){mount.value='inside';roof.value='none'}mount.disabled=isStraight;roof.disabled=isStraight};div.querySelector('.p').addEventListener('change',syncStraight);syncStraight();$('windows').appendChild(div)}
function getRows(){const rows=[];for(const [i,el] of [...document.querySelectorAll('.window:not(.balcony)')].entries()){const w=Number(el.querySelector('.w').value),h=Number(el.querySelector('.h').value),p=Number(el.querySelector('.p').value);if(!Number.isInteger(w)||!Number.isInteger(h)||w<=0||h<=0)throw Error(`Укажите ширину и высоту окна ${i+1} целыми положительными числами.`);const straight=p===0;const mount=straight?'inside':el.querySelector('.mount').value,roof=straight?'none':el.querySelector('.roof').value;let W=w,H=h;if(straight){W=w-10;H=h-10}else if(mount==='inside'){W-=20;H-=roof==='profiled'?50:20}if(W<=30||H<=30)throw Error(`После поправки размеры окна ${i+1} слишком малы.`);const n=straight?Math.ceil(W/125)+1:Math.ceil(W/128);if(n<2||W-15*n<=0)throw Error(`Ширина окна ${i+1} слишком мала для модели R.`);const pd=projectionData[p];const parts=straight?[{name:'Прямые вертикали (высота сварщика минус 30 мм)',len:H-30,count:n},{name:'Горизонтали: верх, низ и 4 ленты',len:W,count:6}]:[{name:'Гнутые длинные вертикали',len:H+pd.add,count:n},{name:'Боковые вертикали',len:H,count:pd.side},{name:'Рамные горизонтали',len:W-30,count:2},{name:'Длинные горизонтали',len:W,count:4},{name:'Короткие боковые горизонтали',len:p,count:8}];if(parts.some(v=>v.len+4>8000))throw Error(`Окно ${i+1}: есть деталь длиннее 8000 мм — требуется отдельная технология.`);rows.push({i:i+1,w,h,W,H,p,mount,roof,n,step:straight?W/(n-1):W/n,gap:straight?(W-15*n)/(n-1):(W-15*n)/(n-1),area:(w*h+2*p*h+2*p*w)/1000000,parts})}return rows}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const projectionOptions=()=>`<option value="0">0 — прямой</option>`+Object.keys(projectionData).map(x=>`<option value="${x}" ${x==='400'?'selected':''}>${x} мм</option>`).join('');
function addBalcony(){balconySeq++;const d=document.createElement('div');d.className='window balcony';d.innerHTML=`<strong>Балкон ${balconySeq}</strong><p class="muted">Размеры от замерщика в мм. Каждая часть имеет собственный вынос.</p><div class="grid"><div><label>Передняя ширина, мм</label><input class="bw" type="number" min="1" step="1" placeholder="2800"></div><div><label>Высота, мм</label><input class="bh" type="number" min="1" step="1" placeholder="2050"></div><div><label>Вынос передней части</label><select class="bpf">${projectionOptions()}</select></div><div><label>Левая боковина</label><select class="blex"><option value="yes">Есть</option><option value="no">Нет боковины</option></select></div><div><label>Ширина левой, мм</label><input class="bl" type="number" min="1" step="1" placeholder="990"></div><div><label>Вынос левой</label><select class="bpl">${projectionOptions()}</select></div><div><label>Правая боковина</label><select class="brex"><option value="yes">Есть</option><option value="no">Нет боковины</option></select></div><div><label>Ширина правой, мм</label><input class="br" type="number" min="1" step="1" placeholder="1020"></div><div><label>Вынос правой</label><select class="bpr">${projectionOptions()}</select></div></div><button class="remove" type="button">Удалить балкон</button>`;d.querySelector('.remove').onclick=()=>d.remove();for(const [selector,input,projection] of [['.blex','.bl','.bpl'],['.brex','.br','.bpr']]){const toggle=()=>{const absent=d.querySelector(selector).value==='no';d.querySelector(input).disabled=absent;d.querySelector(projection).disabled=absent};d.querySelector(selector).addEventListener('change',toggle);toggle()}$('balconies').appendChild(d)}
function getBalconies(){return [...document.querySelectorAll('.balcony')].map((el,i)=>{const get=c=>Number(el.querySelector(c).value);const w=get('.bw'),h=get('.bh'),left=el.querySelector('.blex').value==='yes',right=el.querySelector('.brex').value==='yes',l=left?get('.bl'):0,r=right?get('.br'):0,pf=get('.bpf'),pl=left?get('.bpl'):0,pr=right?get('.bpr'):0;if(![w,h].every(x=>Number.isInteger(x)&&x>0)||(left&&(!Number.isInteger(l)||l<=0))||(right&&(!Number.isInteger(r)||r<=0)))throw Error(`Балкон ${i+1}: укажите положительные целые размеры существующих частей.`);const W=w-20,H=h-50,L=left?l-20:0,R=right?r-20:0;if(W<=30||H<=30||(left&&L<=30)||(right&&R<=30))throw Error(`Балкон ${i+1}: размеры после вычета слишком малы.`);const nFront=Math.ceil(W/125),nLeft=left?Math.ceil(L/125):0,nRight=right?Math.ceil(R/125):0;const sideQty=p=>p?projectionData[p].side:0;const add=p=>p?projectionData[p].add:0;const parts=[];const push=(name,len,count)=>{if(count>0)parts.push({name,len,count})};
// Предварительная модель раскроя: каждая секция с собственным выносом.
push('Передние гнутые / прямые вертикали',H+add(pf),nFront);
// Прямые боковые секции: высота замерщика минус 30 мм, по одному крайнему пруту дополнительно на каждую сторону.
// При боковом выносе используются гнутые детали по прежнему алгоритму.
if(left)push(pl?'Левые гнутые вертикали':'Левые прямые вертикали',pl?H+add(pl):h-30,nLeft+(pl?0:1));
if(right)push(pr?'Правые гнутые вертикали':'Правые прямые вертикали',pr?H+add(pr):h-30,nRight+(pr?0:1));
push('Дополнительные вертикали переднего выноса',H,sideQty(pf));push('Передние длинные горизонтали',W,4);push('Передние рамные горизонтали',W-30,2);push('Левые боковые горизонтали',L,left?6:0);push('Правые боковые горизонтали',R,right?6:0);push('Короткие горизонтали выноса балкона',pf,pf?8:0);
// Соединительные гнутые прутья между передом и боковинами: при одинаковом выносе 400 мм по 3 на угол.
const cornerBends=(pf===400?((left&&pl===400?3:0)+(right&&pr===400?3:0)):0);
push('Угловые гнутые соединительные прутья',H+add(pf),cornerBends);
if(parts.some(v=>v.len+4>8000))throw Error(`Балкон ${i+1}: деталь длиннее допустимых 7996 мм.`);
const areaFront=(w*h+2*w*pf+2*h*pf)/1000000,areaLeft=left?(l*h+2*l*pl+h*pl)/1000000:0,areaRight=right?(r*h+2*r*pr+h*pr)/1000000:0;
const corners=(left?1:0)+(right?1:0);return {i:i+1,w,h,l,r,pf,pl,pr,left,right,W,H,L,R,nFront,nLeft,nRight,cornerBends,stepFront:W/nFront,stepLeft:nLeft?L/nLeft:null,stepRight:nRight?R/nRight:null,parts,areaFront,areaLeft,areaRight,area:areaFront+areaLeft+areaRight,unknown:corners*4,corners}})}
function cutting(rows){const grouped=new Map();for(const r of rows)for(const v of r.parts)grouped.set(v.len,(grouped.get(v.len)||0)+v.count);const pieces=[...grouped].flatMap(([len,count])=>Array.from({length:count},()=>len)).sort((a,b)=>b-a);const bins=[];for(const len of pieces){let best=-1,remain=Infinity;for(let i=0;i<bins.length;i++){const rem=bins[i].remaining-len-4;if(rem>=0&&rem<remain){best=i;remain=rem}}if(best<0)bins.push({remaining:8000-len-4,parts:[len]});else{bins[best].remaining-=len+4;bins[best].parts.push(len)}}const patterns=new Map();for(const bin of bins){const counts=new Map();for(const len of bin.parts)counts.set(len,(counts.get(len)||0)+1);const desc=[...counts].sort((a,b)=>b[0]-a[0]).map(([len,n])=>`${len}${n>1?' × '+n:''}`).join(' + ');const key=desc+'|'+bin.remaining;const obj=patterns.get(key)||{desc,remaining:bin.remaining,count:0};obj.count++;patterns.set(key,obj)}return {bins,patterns:[...patterns.values()],total:pieces.reduce((a,b)=>a+b,0),cuts:pieces.length}}
function render(){try{
$('error').hidden=true;
const rows=getRows(),balconies=getBalconies(),all=[...rows,...balconies];
if(!all.length)throw Error('Добавьте окно или балкон.');
const cut=cutting(all),windowArea=rows.reduce((v,r)=>v+r.area,0),balconyArea=balconies.reduce((v,b)=>v+b.area,0);
const totalArea=windowArea+balconyArea,order=esc($('order').value.trim()||'—'),model=esc($('model').value.trim()||'R');
$('area').value=totalArea.toFixed(2).replace('.',',')+' м²';
let html=`<section class="sheet welder"><h1>Бланк для сварщика · № ${order}</h1><div class="weldmeta">Модель ${model} · ${totalArea.toFixed(2).replace('.',',')} м²</div><div class="weldgrid">`;
for(const r of rows)html+=`<div class="welditem"><h2>Окно ${r.i}</h2><svg class="welddrawing" viewBox="0 0 360 235" xmlns="http://www.w3.org/2000/svg"><path d="M72 30 H290 V180 H72 Z M72 180 L25 133 M290 180 L243 133" fill="none" stroke="#111" stroke-width="4"/><text x="180" y="215" text-anchor="middle" font-size="25" font-weight="bold">${r.W}</text><text x="180" y="18" text-anchor="middle" font-size="17" font-weight="bold">ВИД ИЗ КОМНАТЫ</text><text x="295" y="112" font-size="22" font-weight="bold">${r.H}</text><text x="5" y="119" font-size="22" font-weight="bold">${r.p}</text></svg><div class="weldcaption">${r.mount==='inside'?'Внутри откоса':'Снаружи'} · ${r.roof==='profiled'?'с крышей':'без крыши'}</div></div>`;
for(const b of balconies)html+=`<div class="welditem"><h2>Балкон ${b.i}</h2><svg class="welddrawing" viewBox="0 0 360 235" xmlns="http://www.w3.org/2000/svg"><path d="M65 85 V180 M65 85 H295 M295 85 V180 M65 85 L23 48 M295 85 L337 48" fill="none" stroke="#111" stroke-width="4"/>${b.pf?`<g stroke="#1565a9" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 48 L43 30 L80 30 M80 30 L69 22 M80 30 L69 38 M337 48 L317 30 L280 30 M280 30 L291 22 M280 30 L291 38"/></g>`:''}${(b.pl||b.pr)?`<g stroke="#1565a9" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">${b.pl?`<path d="M23 48 L9 83 M9 83 L3 72 M9 83 L18 76"/>`:''}${b.pr?`<path d="M337 48 L351 83 M351 83 L342 76 M351 83 L357 72"/>`:''}</g>`:''}<text x="180" y="65" text-anchor="middle" font-size="24" font-weight="bold">${b.W}</text><text x="180" y="17" text-anchor="middle" font-size="20" font-weight="bold">Высота ${b.H}</text><text x="180" y="218" text-anchor="middle" font-size="23" font-weight="bold">ДВЕРЬ</text><text x="4" y="143" font-size="19">${b.left?b.L:'нет'}</text><text x="296" y="143" font-size="19">${b.right?b.R:'нет'}</text><text x="5" y="22" font-size="18">${b.pl||b.pf}</text><text x="290" y="22" font-size="18">${b.pr||b.pf}</text></svg><div class="weldcaption">Вид из комнаты · вынос переда ${b.pf} мм</div></div>`;
html+=`</div></section><section class="sheet cutter pagebreak"><h1>Резчику · заказ № ${order} · ${model}</h1><div class="cutcolumns">`;
const items=[...rows.map(r=>({label:'Окно '+r.i,parts:r.parts,step:r.step,bendLength:r.parts[0]?.len})),...balconies.map(b=>({label:'Балкон '+b.i,parts:b.parts,unknown:b.unknown,bendLength:b.parts[0]?.len,stepFront:b.stepFront,stepLeft:b.stepLeft,stepRight:b.stepRight,straightSides:((b.left&&!b.pl)||(b.right&&!b.pr))}))];
for(const item of items){const straightParts=item.straightSides?item.parts.filter(p=>/^(Левые|Правые) прямые вертикали|^(Левые|Правые) боковые горизонтали/.test(p.name)):[];
const mainParts=item.straightSides?item.parts.filter(p=>!straightParts.includes(p)):item.parts;
const counts=new Map();for(const part of mainParts)counts.set(part.len,(counts.get(part.len)||0)+part.count);
// Порядок резки по технологической последовательности: гнутые, вертикали, верх/низ, ленты, короткие боковые ленты.
const cutPriority=name=>{const n=name.toLowerCase();if(n.includes('гнут')||n.includes('соединительн'))return 0;if(n.includes('вертикал'))return 1;if(n.includes('рамн')||n.includes('верх, низ'))return 2;if(n.includes('коротк'))return 4;if(n.includes('длинные горизонтал')||n.includes('горизонтал')||n.includes('лент'))return n.includes('коротк')?4:3;return 3};
const priorityByLength=new Map();for(const part of mainParts){const rank=cutPriority(part.name);priorityByLength.set(part.len,Math.min(priorityByLength.get(part.len)??Infinity,rank))}
const lines=[...counts].sort((a,b)=>{const ap=a[0]===item.bendLength?-1:priorityByLength.get(a[0])??3;const bp=b[0]===item.bendLength?-1:priorityByLength.get(b[0])??3;return ap-bp||b[0]-a[0]});
html+=`<div class="cutitem"><div class="cutheading">${item.label}${item.step?` <span>Шаг: ${(item.step/10).toFixed(1).replace('.',',')} см</span>`:''}</div>`;
if(item.stepFront)html+=`<div class="balsteps">Перед: ${(item.stepFront/10).toFixed(1)} см${item.stepLeft?' · Лево: '+(item.stepLeft/10).toFixed(1)+' см':''}${item.stepRight?' · Право: '+(item.stepRight/10).toFixed(1)+' см':''}</div>`;
for(let i=0;i<lines.length;i++)html+=`<div class="cutline ${i===0?'primary':''}"><b>${lines[i][0]}</b><span>— ${lines[i][1]} шт.</span></div>`;
if(straightParts.length){const sideCounts=new Map();for(const p of straightParts)sideCounts.set(p.len,(sideCounts.get(p.len)||0)+p.count);const sideLines=[...sideCounts].sort((a,b)=>{const pa=straightParts.find(p=>p.len===a[0]);const pb=straightParts.find(p=>p.len===b[0]);return Number(!pa?.name.includes('вертикали'))-Number(!pb?.name.includes('вертикали'))||b[0]-a[0]});html+=`<div class="cutsubhead">Прямые боковые части${item.stepLeft||item.stepRight?` · Шаг: ${((item.stepLeft||item.stepRight)/10).toFixed(1)} см`:''}</div>`;for(const [len,count] of sideLines)html+=`<div class="cutline"><b>${len}</b><span>— ${count} шт.</span></div>`;}
if(item.unknown)html+=`<div class="cutnote">Угловые соединения: ${item.unknown} деталей без уточнённой длины</div>`;
html+=`</div>`}

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькулятор цеха — модель R</title><style>body{font:16px system-ui;background:#f5f6f8;color:#17212b;margin:0}main{max-width:850px;margin:auto;padding:16px}h1{font-size:25px}.panel{background:white;padding:18px;border-radius:12px;margin:14px 0;box-shadow:0 1px 5px #ddd}label{display:block;margin:12px 0 5px;font-weight:600}input,select,button{font:inherit;padding:11px;border:1px solid #c8ced5;border-radius:8px;box-sizing:border-box}input,select{width:100%}button{background:#1465d9;color:white;border:0;margin:8px 6px 8px 0;cursor:pointer}.remove{background:#a63131}.window{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.muted{color:#606a76;font-size:14px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #cbd1d8;padding:7px;text-align:left}th{background:#eef3fa}.warning{background:#fff3cf;padding:12px;border-radius:8px}.sheet{background:white;padding:16px;margin:12px 0}.diagram{border:3px solid #222;position:relative;margin:24px auto 36px;width:70%;height:125px}.diagram .width{position:absolute;bottom:-26px;left:0;right:0;text-align:center}.diagram .height{position:absolute;right:-65px;top:45px}.diagram .proj{position:absolute;left:-65px;top:45px}.pagebreak{break-before:page}.only-print{display:none}@media print{body{background:white}main{max-width:none;padding:0}.panel,.sheet{box-shadow:none;border:0} .no-print{display:none!important}.only-print{display:block}.sheet{padding:0} @page{size:A4 portrait;margin:12mm}h1{font-size:20px}table{font-size:11px}th,td{padding:4px}.diagram{height:85px;margin:14px auto 27px}} </style></head><body><main><div class="no-print"><h1>Калькулятор цеха — модель R</h1><p class="muted">Тестовая версия. Все размеры в миллиметрах. Перед производством сверяйте результат с технологом.</p><section class="panel"><label>Номер заказа</label><input id="order" placeholder="Например, 2805"><label>Модель заказа</label><input id="model" value="R-1"><label>Квадратура, м² (вводится вручную)</label><input id="area" type="number" min="0" step="0.01" placeholder="Например, 20.62"><label>Установка</label><select id="mount"><option value="outside">Снаружи откоса</option><option value="inside">Внутри откоса</option></select><label>Крыша</label><select id="roof"><option value="none">Без крыши</option><option value="profiled">С крышей — профнастил</option></select><p class="muted">При установке внутри откоса: ширина −20 мм, высота −20 мм без крыши или −50 мм с профнастилом.</p></section><section class="panel"><h2>Размеры от замерщика</h2><div id="windows"></div><button type="button" id="add">+ Добавить окно</button></section><button type="button" id="calculate">Рассчитать</button><button type="button" id="print">Печать / PDF</button><p id="error" class="warning" hidden></p></div><div id="result"></div></main><script>
'use strict';const $=id=>document.getElementById(id);const projectionData={200:{add:190,side:4},300:{add:390,side:4},400:{add:590,side:6},500:{add:790,side:8},600:{add:990,side:10}};let seq=0;
function addWindow(){seq++;const div=document.createElement('div');div.className='window';div.innerHTML=`<strong>Окно ${seq}</strong><div class="grid"><div><label>Ширина, мм</label><input class="w" type="number" min="1" step="1" placeholder="2900"></div><div><label>Высота, мм</label><input class="h" type="number" min="1" step="1" placeholder="1580"></div><div><label>Вынос, мм</label><select class="p">${Object.keys(projectionData).map(x=>`<option value="${x}" ${x==='400'?'selected':''}>${x}</option>`).join('')}</select></div></div><button class="remove" type="button">Удалить окно</button>`;div.querySelector('.remove').onclick=()=>div.remove();$('windows').appendChild(div)}
function getRows(){const rows=[];for(const [i,el] of [...document.querySelectorAll('.window')].entries()){const w=Number(el.querySelector('.w').value),h=Number(el.querySelector('.h').value),p=Number(el.querySelector('.p').value);if(!Number.isInteger(w)||!Number.isInteger(h)||w<=0||h<=0)throw Error(`Укажите ширину и высоту окна ${i+1} целыми положительными числами.`);let W=w,H=h;if($('mount').value==='inside'){W-=20;H-=$('roof').value==='profiled'?50:20}if(W<=30||H<=0)throw Error(`После поправки размеры окна ${i+1} слишком малы.`);const n=Math.ceil(W/128);if(n<2)throw Error(`Ширина окна ${i+1} слишком мала для модели R.`);const pd=projectionData[p];const parts=[{name:'Гнутые длинные вертикали',len:H+pd.add,count:n},{name:'Боковые вертикали',len:H,count:pd.side},{name:'Рамные горизонтали',len:W-30,count:2},{name:'Длинные горизонтали',len:W,count:4},{name:'Короткие боковые горизонтали',len:p,count:8}];if(parts.some(v=>v.len>8000))throw Error(`Окно ${i+1}: есть деталь длиннее 8000 мм — требуется отдельная технология.`);rows.push({i:i+1,w,h,W,H,p,n,step:W/n,gap:(W-15*n)/(n-1),parts})}if(!rows.length)throw Error('Добавьте хотя бы одно окно.');return rows}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cutting(rows){const grouped=new Map();for(const r of rows)for(const v of r.parts)grouped.set(v.len,(grouped.get(v.len)||0)+v.count);const pieces=[...grouped].flatMap(([len,count])=>Array.from({length:count},()=>len)).sort((a,b)=>b-a);const bins=[];for(const len of pieces){let best=-1,remain=Infinity;for(let i=0;i<bins.length;i++){const rem=bins[i].remaining-len-4;if(rem>=0&&rem<remain){best=i;remain=rem}}if(best<0)bins.push({remaining:8000-len-4,parts:[len]});else{bins[best].remaining-=len+4;bins[best].parts.push(len)}}const patterns=new Map();for(const bin of bins){const counts=new Map();for(const len of bin.parts)counts.set(len,(counts.get(len)||0)+1);const desc=[...counts].sort((a,b)=>b[0]-a[0]).map(([len,n])=>`${len}${n>1?' × '+n:''}`).join(' + ');const key=desc+'|'+bin.remaining;const obj=patterns.get(key)||{desc,remaining:bin.remaining,count:0};obj.count++;patterns.set(key,obj)}return {bins,patterns:[...patterns.values()],total:pieces.reduce((a,b)=>a+b,0),cuts:pieces.length}}
function render(){try{$('error').hidden=true;const rows=getRows(),cut=cutting(rows);const area=$('area').value.trim(),order=esc($('order').value.trim()||'—'),model=esc($('model').value.trim()||'R'),fmt=x=>x.toFixed(2).replace('.',',');let html=`<section class="sheet"><h1>Сварщику — заказ № ${order}</h1><p><b>Модель:</b> ${model} · <b>Квадратура:</b> ${area?esc(area)+' м²':'не указана'} · <b>Монтаж:</b> ${$('mount').value==='inside'?'внутри откоса':'снаружи откоса'} · <b>Крыша:</b> ${$('roof').value==='profiled'?'профнастил':'нет'}</p>`;for(const r of rows)html+=`<div><b>Окно ${r.i}</b> — ${r.W} × ${r.H} мм<div class="diagram"><span class="width">↔ ${r.W} мм</span><span class="height">↕ ${r.H} мм</span><span class="proj">Вынос<br>${fmt(r.p/1000)} м</span></div></div>`;html+=`</section><section class="sheet pagebreak"><h1>Резчику — заказ № ${order}, ${model}</h1>`;for(const r of rows){html+=`<h3>Окно ${r.i}: ${r.W} × ${r.H} мм; вынос ${r.p} мм</h3><p>Шаг расчётный: <b>${fmt(r.step)} мм</b>; фактический свободный просвет: <b>${fmt(r.gap)} мм</b></p><table><thead><tr><th>Деталь</th><th>Длина, мм</th><th>Шт.</th></tr></thead><tbody>`;for(const v of r.parts)html+=`<tr><td>${v.name}</td><td>${v.len}</td><td>${v.count}</td></tr>`;html+='</tbody></table>'}html+=`<h2>Раскрой новых хлыстов 8000 мм</h2><p><b>Всего:</b> ${cut.bins.length} хлыстов; деталей ${cut.cuts}; длина деталей ${fmt(cut.total/1000)} м.</p><table><thead><tr><th>Хлыстов</th><th>Что резать с одного хлыста, мм</th><th>Остаток каждого, мм</th></tr></thead><tbody>`;for(const p of cut.patterns)html+=`<tr><td>${p.count}</td><td>${p.desc}</td><td>${p.remaining}</td></tr>`;const leftovers=cut.bins.reduce((s,b)=>s+b.remaining,0);html+=`</tbody></table><p><b>Сумма остатков:</b> ${fmt(leftovers/1000)} м. Сохранять все остатки.</p><p class="muted">Раскрой рассчитан эвристическим алгоритмом и не гарантирует минимального количества хлыстов. Контрольная проверка перед резкой обязательна.</p></section>`;$('result').innerHTML=html;return true}catch(e){$('error').textContent=e.message;$('error').hidden=false;$('result').innerHTML='';return false}}
$('add').onclick=addWindow;$('calculate').onclick=render;$('print').onclick=()=>{if(render())window.print()};addWindow();
</script></body></html>

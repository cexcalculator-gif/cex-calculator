<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Калькулятор цеха — модель R</title><style>body{font:16px system-ui;background:#f5f6f8;color:#17212b;margin:0}main{max-width:850px;margin:auto;padding:16px}h1{font-size:25px}.panel{background:white;padding:18px;border-radius:12px;margin:14px 0;box-shadow:0 1px 5px #ddd}label{display:block;margin:12px 0 5px;font-weight:600}input,select,button{font:inherit;padding:11px;border:1px solid #c8ced5;border-radius:8px;box-sizing:border-box}input,select{width:100%}button{background:#1465d9;color:white;border:0;margin:8px 6px 8px 0;cursor:pointer}.remove{background:#a63131}.window{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.muted{color:#606a76;font-size:14px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #cbd1d8;padding:7px;text-align:left}th{background:#eef3fa}.warning{background:#fff3cf;padding:12px;border-radius:8px}.sheet{background:white;padding:16px;margin:12px 0}.diagram{border:3px solid #222;position:relative;margin:24px auto 36px;width:70%;height:125px}.diagram .width{position:absolute;bottom:-26px;left:0;right:0;text-align:center}.diagram .height{position:absolute;right:-65px;top:45px}.diagram .proj{position:absolute;left:-65px;top:45px}.pagebreak{break-before:page}.only-print{display:none}@media print{body{background:white}main{max-width:none;padding:0}.panel,.sheet{box-shadow:none;border:0} .no-print{display:none!important}.only-print{display:block}.sheet{padding:0} @page{size:A4 portrait;margin:12mm}h1{font-size:20px}table{font-size:11px}th,td{padding:4px}.diagram{height:85px;margin:14px auto 27px}} .drawing-item{display:inline-block;vertical-align:top;width:30.5%;margin:1%;break-inside:avoid;font-size:12px}.drawing{width:100%;max-height:125px}.small{font-size:11px;color:#555}.welder{break-after:page}@media print{@page{size:A4 portrait;margin:8mm}.drawing-item{width:30.5%;margin:1%;font-size:10px}.drawing{max-height:95px}.sheet{break-inside:auto}.pagebreak{break-before:page}}</style></head><body><main><div class="no-print"><h1>Калькулятор цеха — модель R</h1><p class="muted">Тестовая версия модели R. Квадратура считается автоматически по размерам замерщика. Раскрой балконов предварительный: угловые соединения и независимые выносы требуют проверки технологом.</p><section class="panel"><label>Номер заказа</label><input id="order" placeholder="Например, 2805"><label>Квадратура заказа, м² (автоматически)</label><input id="area" type="text" readonly placeholder="Рассчитается после ввода размеров"><label>Модель заказа</label><input id="model" value="R-1"></section><section class="panel"><h2>Размеры от замерщика</h2><div id="windows"></div><button type="button" id="add">+ Добавить окно</button><button type="button" id="addBalcony">+ Добавить балкон</button><div id="balconies"></div></section><button type="button" id="calculate">Рассчитать</button><button type="button" id="print">Печать / PDF</button><p id="error" class="warning" hidden></p></div><div id="result"></div></main><script>
'use strict';const $=id=>document.getElementById(id);const projectionData={200:{add:190,side:4},300:{add:390,side:4},400:{add:590,side:6},500:{add:790,side:8},600:{add:990,side:10}};let seq=0,balconySeq=0;
function addWindow(){if(document.querySelectorAll('.window').length>=8){alert('Можно добавить не более 8 окон.');return;}seq++;const div=document.createElement('div');div.className='window';div.innerHTML=`<strong>Окно ${seq}</strong><div class="grid"><div><label>Ширина, мм</label><input class="w" type="number" min="1" step="1" placeholder="2900"></div><div><label>Высота, мм</label><input class="h" type="number" min="1" step="1" placeholder="1580"></div><div><label>Вынос, мм</label><select class="p">${`<option value="0">0 — прямое окно</option>`+Object.keys(projectionData).map(x=>`<option value="${x}" ${x==='400'?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Установка</label><select class="mount"><option value="outside">Снаружи откоса</option><option value="inside">Внутри откоса</option></select></div><div><label>Крыша</label><select class="roof"><option value="none">Без крыши</option><option value="profiled">С крышей — профнастил</option></select></div></div><button class="remove" type="button">Удалить окно</button>`;div.querySelector('.remove').onclick=()=>div.remove();$('windows').appendChild(div)}
function getRows(){const rows=[];for(const [i,el] of [...document.querySelectorAll('.window:not(.balcony)')].entries()){const w=Number(el.querySelector('.w').value),h=Number(el.querySelector('.h').value),p=Number(el.querySelector('.p').value);if(!Number.isInteger(w)||!Number.isInteger(h)||w<=0||h<=0)throw Error(`Укажите ширину и высоту окна ${i+1} целыми положительными числами.`);let W=w,H=h;const mount=el.querySelector('.mount').value,roof=el.querySelector('.roof').value;if(mount==='inside'){W-=20;H-=roof==='profiled'?50:20}if(W<=30||H<=0)throw Error(`После поправки размеры окна ${i+1} слишком малы.`);const n=Math.ceil(W/128);if(n<2||W-15*n<=0)throw Error(`Ширина окна ${i+1} слишком мала для модели R.`);const pd=projectionData[p];const parts=p===0?[{name:'Прямые вертикали (без выноса)',len:H,count:n},{name:'Рамные горизонтали',len:W-30,count:2},{name:'Длинные горизонтали',len:W,count:4}]:[{name:'Гнутые длинные вертикали',len:H+pd.add,count:n},{name:'Боковые вертикали',len:H,count:pd.side},{name:'Рамные горизонтали',len:W-30,count:2},{name:'Длинные горизонтали',len:W,count:4},{name:'Короткие боковые горизонтали',len:p,count:8}];if(parts.some(v=>v.len+4>8000))throw Error(`Окно ${i+1}: есть деталь длиннее 8000 мм — требуется отдельная технология.`);rows.push({i:i+1,w,h,W,H,p,mount,roof,n,step:W/n,gap:(W-15*n)/(n-1),area:(w*h+2*p*h+2*p*w)/1000000,parts})}return rows}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const projectionOptions=()=>`<option value="0">0 — прямой</option>`+Object.keys(projectionData).map(x=>`<option value="${x}" ${x==='400'?'selected':''}>${x} мм</option>`).join('');
function addBalcony(){balconySeq++;const d=document.createElement('div');d.className='window balcony';d.innerHTML=`<strong>Балкон ${balconySeq}</strong><p class="muted">Размеры от замерщика в мм. Каждая часть имеет собственный вынос.</p><div class="grid"><div><label>Передняя ширина, мм</label><input class="bw" type="number" min="1" step="1" placeholder="2800"></div><div><label>Высота, мм</label><input class="bh" type="number" min="1" step="1" placeholder="2050"></div><div><label>Вынос передней части</label><select class="bpf">${projectionOptions()}</select></div><div><label>Левая боковина</label><select class="blex"><option value="yes">Есть</option><option value="no">Нет боковины</option></select></div><div><label>Ширина левой, мм</label><input class="bl" type="number" min="1" step="1" placeholder="990"></div><div><label>Вынос левой</label><select class="bpl">${projectionOptions()}</select></div><div><label>Правая боковина</label><select class="brex"><option value="yes">Есть</option><option value="no">Нет боковины</option></select></div><div><label>Ширина правой, мм</label><input class="br" type="number" min="1" step="1" placeholder="1020"></div><div><label>Вынос правой</label><select class="bpr">${projectionOptions()}</select></div></div><button class="remove" type="button">Удалить балкон</button>`;d.querySelector('.remove').onclick=()=>d.remove();for(const [selector,input,projection] of [['.blex','.bl','.bpl'],['.brex','.br','.bpr']]){const toggle=()=>{const absent=d.querySelector(selector).value==='no';d.querySelector(input).disabled=absent;d.querySelector(projection).disabled=absent};d.querySelector(selector).addEventListener('change',toggle);toggle()}$('balconies').appendChild(d)}
function getBalconies(){return [...document.querySelectorAll('.balcony')].map((el,i)=>{const get=c=>Number(el.querySelector(c).value);const w=get('.bw'),h=get('.bh'),left=el.querySelector('.blex').value==='yes',right=el.querySelector('.brex').value==='yes',l=left?get('.bl'):0,r=right?get('.br'):0,pf=get('.bpf'),pl=left?get('.bpl'):0,pr=right?get('.bpr'):0;if(![w,h].every(x=>Number.isInteger(x)&&x>0)||(left&&(!Number.isInteger(l)||l<=0))||(right&&(!Number.isInteger(r)||r<=0)))throw Error(`Балкон ${i+1}: укажите положительные целые размеры существующих частей.`);const W=w-20,H=h-50,L=left?l-20:0,R=right?r-20:0;if(W<=30||H<=30||(left&&L<=30)||(right&&R<=30))throw Error(`Балкон ${i+1}: размеры после вычета слишком малы.`);const nFront=Math.ceil(W/125),nLeft=left?Math.ceil(L/125):0,nRight=right?Math.ceil(R/125):0;const sideQty=p=>p?projectionData[p].side:0;const add=p=>p?projectionData[p].add:0;const parts=[];const push=(name,len,count)=>{if(count>0)parts.push({name,len,count})};
// Предварительная модель раскроя: каждая секция с собственным выносом.
push('Передние гнутые / прямые вертикали',H+add(pf),nFront);push('Левые гнутые / прямые вертикали',H+add(pl),nLeft);push('Правые гнутые / прямые вертикали',H+add(pr),nRight);push('Дополнительные вертикали переднего выноса',H,sideQty(pf));push('Дополнительные вертикали левого выноса',H,sideQty(pl));push('Дополнительные вертикали правого выноса',H,sideQty(pr));push('Передние длинные горизонтали',w,4);push('Передние рамные горизонтали',w-30,2);push('Левые боковые горизонтали',L,left?6:0);push('Правые боковые горизонтали',R,right?6:0);push('Короткие горизонтали переднего выноса',pf,pf?8:0);push('Короткие горизонтали левого выноса',pl,pl?4:0);push('Короткие горизонтали правого выноса',pr,pr?4:0);
if(parts.some(v=>v.len+4>8000))throw Error(`Балкон ${i+1}: деталь длиннее допустимых 7996 мм.`);
const areaFront=(w*h+2*w*pf+2*h*pf)/1000000,areaLeft=left?(l*h+2*l*pl+h*pl)/1000000:0,areaRight=right?(r*h+2*r*pr+h*pr)/1000000:0;
const corners=(left?1:0)+(right?1:0);return {i:i+1,w,h,l,r,pf,pl,pr,left,right,W,H,L,R,nFront,nLeft,nRight,parts,areaFront,areaLeft,areaRight,area:areaFront+areaLeft+areaRight,unknown:corners*4,corners}})}
function cutting(rows){const grouped=new Map();for(const r of rows)for(const v of r.parts)grouped.set(v.len,(grouped.get(v.len)||0)+v.count);const pieces=[...grouped].flatMap(([len,count])=>Array.from({length:count},()=>len)).sort((a,b)=>b-a);const bins=[];for(const len of pieces){let best=-1,remain=Infinity;for(let i=0;i<bins.length;i++){const rem=bins[i].remaining-len-4;if(rem>=0&&rem<remain){best=i;remain=rem}}if(best<0)bins.push({remaining:8000-len-4,parts:[len]});else{bins[best].remaining-=len+4;bins[best].parts.push(len)}}const patterns=new Map();for(const bin of bins){const counts=new Map();for(const len of bin.parts)counts.set(len,(counts.get(len)||0)+1);const desc=[...counts].sort((a,b)=>b[0]-a[0]).map(([len,n])=>`${len}${n>1?' × '+n:''}`).join(' + ');const key=desc+'|'+bin.remaining;const obj=patterns.get(key)||{desc,remaining:bin.remaining,count:0};obj.count++;patterns.set(key,obj)}return {bins,patterns:[...patterns.values()],total:pieces.reduce((a,b)=>a+b,0),cuts:pieces.length}}
function render(){try{$('error').hidden=true;const rows=getRows(),balconies=getBalconies(),all=[...rows,...balconies];if(!all.length)throw Error('Добавьте окно или балкон.');const cut=cutting(all),windowArea=rows.reduce((sum,r)=>sum+r.area,0),balconyArea=balconies.reduce((sum,b)=>sum+b.area,0),totalArea=windowArea+balconyArea,area=totalArea.toFixed(2).replace('.',','),order=esc($('order').value.trim()||'—'),model=esc($('model').value.trim()||'R'),fmt=x=>x.toFixed(2).replace('.',',');$('area').value=area+' м²';let html=`<section class="sheet welder"><h1>Бланк для цеха</h1><p><b>Номер заказа:</b> ${order} · <b>Квадратура заказа:</b> ${area} м² · <b>Модель:</b> ${model}</p>`;
for(const r of rows)html+=`<div class="drawing-item"><b>Окно ${r.i}</b> — ${r.W} × ${r.H} мм<div class="small">Замер: ${r.w} × ${r.h}; ${r.mount==='inside'?'внутри':'снаружи'}; ${r.roof==='profiled'?'профнастил':'без крыши'}</div><svg role="img" class="drawing" viewBox="0 0 300 128" xmlns="http://www.w3.org/2000/svg"><path d="M60 12 H242 V103 H60 Z M60 103 L31 74 M242 103 L213 74" fill="none" stroke="#222" stroke-width="2.4"/><text x="151" y="122" text-anchor="middle" font-size="12">${r.W} мм</text><text x="246" y="56" font-size="11">${r.H}</text><text x="4" y="83" font-size="11">${r.p}</text></svg></div>`;
for(const b of balconies)html+=`<div class="drawing-item"><b>Балкон ${b.i}</b> — ${b.W} × ${b.H} мм<div class="small">Слева ${b.left?b.L+' / '+b.pl:'нет'}; справа ${b.right?b.R+' / '+b.pr:'нет'}; передний вынос ${b.pf} мм</div><svg role="img" class="drawing" viewBox="0 0 300 128" xmlns="http://www.w3.org/2000/svg"><path d="M58 23 V94 H244 V23 M58 23 H88 M214 23 H244" fill="none" stroke="#222" stroke-width="2.4"/><text x="151" y="115" text-anchor="middle" font-size="12">${b.W} мм</text><text x="9" y="65" font-size="11">${b.left?b.L:'нет'}</text><text x="248" y="65" font-size="11">${b.right?b.R:'нет'}</text><text x="112" y="18" font-size="11">Высота ${b.H}</text></svg></div>`;
html+=`</section><section class="sheet pagebreak"><h1>Резчику — заказ № ${order}, ${model}</h1>`;
for(const r of rows){
html+=`<h2>Окно ${r.i} — отдельный расчёт</h2><p>${r.W} × ${r.H} мм; вынос ${r.p} мм; <b>площадь ${fmt(r.area)} м²</b>; шаг ${fmt(r.step)} мм.</p><table><thead><tr><th>Длина, мм</th><th>Количество, шт.</th></tr></thead><tbody>`;
const individual=new Map();for(const v of r.parts)individual.set(v.len,(individual.get(v.len)||0)+v.count);
for(const [len,count] of [...individual].sort((a,b)=>b[0]-a[0]))html+=`<tr><td>${len}</td><td>${count}</td></tr>`;
html+=`</tbody></table>`;
}
if(rows.length)html+=`<p><b>Итого площадь всех окон:</b> ${fmt(windowArea)} м². Расчёт по размерам замерщика, с четырьмя сторонами выноса.</p>`;for(const b of balconies){html+=`<h2>Балкон ${b.i} — отдельный расчёт</h2><p>Перед ${b.w} × ${b.h} мм, вынос ${b.pf}; слева ${b.left?b.l+' мм, вынос '+b.pl:'отсутствует'}; справа ${b.right?b.r+' мм, вынос '+b.pr:'отсутствует'}.</p><table><thead><tr><th>Квадратура по частям</th><th>м²</th></tr></thead><tbody><tr><td>Передняя</td><td>${fmt(b.areaFront)}</td></tr><tr><td>Левая</td><td>${fmt(b.areaLeft)}</td></tr><tr><td>Правая</td><td>${fmt(b.areaRight)}</td></tr><tr><th>Балкон всего</th><th>${fmt(b.area)}</th></tr></tbody></table><p class="warning">Раскрой балкона предварительный. Независимые выносы и угловые соединения требуют проверки технологом.</p><table><thead><tr><th>Деталь</th><th>Длина, мм</th><th>Шт.</th></tr></thead><tbody>`;for(const part of b.parts)html+=`<tr><td>${part.name}</td><td>${part.len}</td><td>${part.count}</td></tr>`;html+=`</tbody></table>`;}
html+=`<h2>Итого по заказу</h2><p><b>Окна:</b> ${fmt(windowArea)} м² · <b>Балконы:</b> ${fmt(balconyArea)} м² · <b>Всего:</b> ${fmt(totalArea)} м².</p>`;
const combined=new Map();for(const v of all.flatMap(r=>r.parts))combined.set(v.len,(combined.get(v.len)||0)+v.count);html+=`<h2>Общий список деталей для раскроя</h2><table><thead><tr><th>Длина, мм</th><th>Количество, шт.</th></tr></thead><tbody>`;for(const [len,count] of [...combined].sort((a,b)=>b[0]-a[0]))html+=`<tr><td>${len}</td><td>${count}</td></tr>`;html+=`</tbody></table>`;
const unknown=balconies.reduce((s,b)=>s+b.unknown,0);if(unknown)html+=`<p class="warning"><b>Не рассчитано:</b> ${unknown} горизонтальных профилей угловых соединений (по 4 на каждый угол балкона). Длина уточняется. Итог расхода и раскроя НЕ окончательный.</p>`;
html+=`<h2>Раскрой известных деталей из профиля 8000 мм</h2><p><b>Предварительно:</b> ${cut.bins.length} профилей; ${cut.cuts} деталей; ${fmt(cut.total/1000)} м деталей.</p><table><thead><tr><th>Профилей</th><th>Что резать с одного профиля, мм</th><th>Остаток, мм</th></tr></thead><tbody>`;for(const p of cut.patterns)html+=`<tr><td>${p.count}</td><td>${p.desc}</td><td>${p.remaining}</td></tr>`;const leftovers=cut.bins.reduce((s,b)=>s+b.remaining,0);html+=`</tbody></table><p>Сумма остатков: ${fmt(leftovers/1000)} м. Все остатки сохранять. На каждую деталь заложено 4 мм реза.</p><p class="muted">Раскрой эвристический, не гарантирует минимум профилей. Контроль технолога перед резкой обязателен.</p></section>`;$('result').innerHTML=html;return true}catch(e){$('error').textContent=e.message;$('error').hidden=false;$('result').innerHTML='';return false}}
$('add').onclick=addWindow;$('addBalcony').onclick=addBalcony;$('calculate').onclick=render;$('print').onclick=()=>{if(render())window.print()};
</script></body></html>
